id: PQB-P08
title: 记账 App 新手引导改版实验
category: metrics_acceptance # 指标定义和验收标准
case_version: v0.3 # v0.3: H quotes verbatim; baseline (old H7) moved out of H
status: draft

frozen_input:
  user_idea: |-
    记账 App 准备改版新用户引导流程：从现在的 5 步缩短为 3 步，并在引导中增加"导入银行账单"入口，希望提升新用户激活率和次周留存。PRD 需要明确指标定义、实验方案和验收标准，用于决定改版是否全量上线。
  target_audience: |-
    新注册用户；产品、数据分析、研发、测试人员。
  user_constraints: |-
    激活：注册后 72 小时内完成至少 3 笔记账，或成功导入 1 份银行账单。次周留存：注册后第 8 至 14 天内至少活跃 1 天；活跃指打开 App 并产生任意记账行为。当前激活率 32%，次周留存 18%。实验最多使用 50% 的新用户流量，实验期最长 4 周。改版不得使次周留存下降超过 1 个百分点。导入失败率需低于 5%。

evaluator_context: |-
  考察能否原样使用给定的指标定义并补齐口径细节、设计可执行的实验与决策规则、写出可判定的功能验收标准。
  题面有意留下的空白：注册当天算第 0 天还是第 1 天、"实验期最长 4 周"是否包含留存观察期、
  导入失败率的分母、成功导入是否算"记账行为"、对照组能否在其他入口导入账单、目标提升幅度。
  P0 一致性修订：v0 金标准把"4 周内最后入组日期前移"写成确定要求，但题面的 4 周可能只指入组期；
  已改为 C 条目检查 PRD 是否处理入组期与 14 天观察期的关系，两种解读均可接受。
  v0.2 修订：R12 降为普通项（其违规情形由 P08-X5 覆盖）；新增 hard_constraints，H4 不预设 4 周的解读。
  v0.3 修订：基线数据移出 H（原 H7）。基线是事实数据而非约束，引用错误由 R3 作为一般性正确性缺陷处理，不触发硬约束封顶。

hard_constraints:
  - id: H1
    text: 激活：注册后 72 小时内完成至少 3 笔记账，或成功导入 1 份银行账单
    quote: 激活：注册后 72 小时内完成至少 3 笔记账，或成功导入 1 份银行账单
  - id: H2
    text: 次周留存：注册后第 8 至 14 天内至少活跃 1 天；活跃指打开 App 并产生任意记账行为
    quote: 次周留存：注册后第 8 至 14 天内至少活跃 1 天；活跃指打开 App 并产生任意记账行为
  - id: H3
    text: 实验最多使用 50% 的新用户流量
    quote: 实验最多使用 50% 的新用户流量
  - id: H4
    text: 实验期最长 4 周
    quote: 实验期最长 4 周
    note: 是否包含 14 天观察期见 C1，任一解读都不违反 H4
  - id: H5
    text: 改版不得使次周留存下降超过 1 个百分点
    quote: 改版不得使次周留存下降超过 1 个百分点
    note: 百分点为绝对差；写成 1% 相对下降属于改写阈值
  - id: H6
    text: 导入失败率需低于 5%
    quote: 导入失败率需低于 5%

required_items:
  - id: R1
    text: 激活率定义：分子、分母、72 小时窗口、两个达成条件（3 笔记账或成功导入 1 份账单）
    source: E
    core: true
    impact: 主指标口径不一致时，实验结果不能用于题面要求的全量决策
    check: 与题面一致；擅自改动条件（如改为 2 笔、改为 7 天）判为 contradicted
  - id: R2
    text: 次周留存定义：分子、分母、第 8 至 14 天窗口、活跃的定义
    source: E
    core: true
    impact: 同上，且留存同时是护栏指标，口径错误会让护栏失效
    check: 同上
  - id: R3
    text: 基线：激活率 32%、次周留存 18%
    source: E
    core: false
    check: 数值正确；引用错误判 contradicted（general，不是硬约束违规）
  - id: R4
    text: 实验设计：以用户为随机化单位、分流比例不超过 50%、对照组与实验组的定义
    source: ED
    core: true
    impact: 随机化单位或分组不清时，同一用户可能看到两个版本，实验结论无效
    rationale: 流量上限是题面给定的；随机化单位不写明会导致同一用户看到两个版本
    check: 三点齐全为 covered
  - id: R5
    text: 样本量或实验时长估算，或说明估算所需输入并交由数据分析给出
    source: D
    core: false
    rationale: 不估算无法判断 4 周是否足够
    check: 给出估算或明确列出估算依赖（基线、目标提升、显著性水平、功效）
  - id: R6
    text: 护栏指标：次周留存下降不超过 1 个百分点、导入失败率低于 5%
    source: E
    core: true
    impact: 护栏缺失或阈值错误时，留存下降或导入故障不会触发回滚
    check: 两个阈值都正确；把 1 个百分点写成 1% 相对下降判为 contradicted
  - id: R7
    text: 决策规则：在什么结果下全量、回滚或延长实验，含护栏触发时的处理
    source: ED
    core: true
    impact: 题面明确 PRD 用于全量决策；没有决策规则，实验结束后仍无法决定全量或回滚
    rationale: 题面要求 PRD 用于"决定是否全量"；没有规则则无法决策
    check: 至少覆盖全量与回滚两种结果，并引用主指标与护栏
  - id: R8
    text: 埋点事件定义：注册、引导各步骤、记账、导入尝试与结果、打开 App
    source: D
    core: false
    rationale: 指标的分子分母依赖这些事件
    check: 覆盖计算激活、留存、导入失败率所需的事件
  - id: R9
    text: 功能验收标准：引导从 5 步缩短为 3 步（3 步的内容与顺序）、导入入口、跳过与返回、导入失败时的用户提示
    source: ED
    core: true
    impact: 题面明确要求验收标准；缺失时测试无法判断改版功能是否正确交付
    rationale: 题面要求验收标准；跳过和失败提示是引导流程必然存在的分支
    check: 每项都可判定；格式不限
  - id: R10
    text: 导入失败率的口径：失败的定义与分母
    source: ED
    core: false
    rationale: 阈值是题面给定的；口径不定义则无法验收
    check: 给出口径或列入 C 条目
  - id: R11
    text: 实验污染控制：多设备登录、卸载重装、重复注册
    source: D
    core: false
    rationale: 以新用户为对象的实验常见的分组污染来源
    check: 至少处理一种
  - id: R12
    text: 留存只统计观察期已满 14 天的用户
    source: D
    core: false
    rationale: 观察期未满的用户计入会系统性低估留存。v0.2 降为普通项：遗漏这句说明本身不改变设计，设计上把未满观察期用户计入的情形由 P08-X5 覆盖
    check: 明确写出

clarifications:
  - id: C1
    question: 实验期最长 4 周是否包含 14 天的留存观察期；若包含，最晚入组日期需要前移
    core: true
    impact: 若 4 周包含观察期而入组未前移，最后两周入组的用户无法完成留存观察，实验结束时留存数据不完整
    accept: 识别入组期与观察期的关系，提出问题或明确一种解读并标注为假设
    not_counted: 只写"实验 4 周"而不讨论观察期
  - id: C2
    question: 目标提升幅度（最小可检测效应）与显著性水平
    core: true
    impact: 没有目标提升幅度就无法估算样本量，也无法判断结果是否"足够好"到全量
    accept: 提出问题，或给出候选值并标注待确认
    not_counted: 自行设定目标并当作既定目标
  - id: C3
    question: 天数计算方式：注册当天算第 0 天还是第 1 天，按自然日还是按 24 小时
    core: false
    accept: 提出问题，或明确定义并标注为假设
  - id: C4
    question: 成功导入银行账单是否算作"记账行为"（影响活跃与留存的判定）
    core: false
    accept: 同上
  - id: C5
    question: 对照组能否通过其他入口导入账单（影响两组激活率的可比性）
    core: false
    accept: 同上

acceptable_assumptions:
  - 注册当天为第 0 天，按自然日计算（标注为假设）
  - 4 周为入组期，另加 14 天观察期（标注为假设，或采用另一种解读并前移入组截止）
  - 导入失败率 = 失败的导入尝试数 / 全部导入尝试数
  - 留存护栏用置信区间下界判断是否下降超过 1 个百分点
  - 成功导入视为记账行为（标注为假设）

critical_defects:
  - id: P08-X1
    condition: 改动题面给定的激活或次周留存定义（时间窗口、达成条件、活跃定义），且未说明是对题面的修改
  - id: P08-X2
    condition: 护栏阈值与题面不符（留存下降阈值、导入失败率阈值）
  - id: P08-X3
    condition: 分流比例超过 50%，或实验期超过 4 周且未讨论
  - id: P08-X4
    condition: 没有任何决策规则（无法据此决定全量或回滚）
  - id: P08-X5
    condition: 设计上把观察期未满的用户计入次周留存

judge_notes: |-
  对题面空白的补充（天数计算、失败率分母）只要标注为假设，不构成 P08-X1。
  不要求文档给出具体样本量数字；给出估算所需输入并说明由数据分析计算即可判 R5 covered。
  验收标准格式不限，Given/When/Then 不加分。
