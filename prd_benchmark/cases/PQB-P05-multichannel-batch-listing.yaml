id: PQB-P05
title: 商品批量同步到多销售渠道
category: failure_retry_cancel # 失败、重试、取消和部分成功
case_version: v0.3 # v0.3: H quotes verbatim
status: draft

frozen_input:
  user_idea: |-
    电商商家后台新增"批量上架到多渠道"功能。商家上传 CSV 文件（最多 10000 行，每行一个商品），系统校验后把商品同步到自营商城、渠道 A、渠道 B 三个销售渠道。每个渠道有独立的接口和独立的限流，可能出现单个商品失败、请求超时或渠道临时维护。商家需要实时查看进度，能对失败的商品重试，并能导出失败明细。
  target_audience: |-
    电商商家的运营人员。
  user_constraints: |-
    渠道 A 限流 50 次/秒，渠道 B 限流 10 次/秒。任一渠道的失败不得影响其他渠道的同步。同一商品在同一渠道不得被重复创建，重试必须幂等。商家可以在任务进行中取消，已经上架成功的商品不自动下架。任务结果保留 30 天。

evaluator_context: |-
  考察部分成功语义、渠道隔离、可重试错误分类、幂等、取消语义，以及"请求超时导致结果未知"这一最容易被忽略的情况。
  题面没有说明：限流是按商家还是全平台计算、渠道是否提供按外部编码查询商品的接口、商品已存在时是更新还是跳过、
  部分行校验失败时其余行是否继续。这些进入 C 条目。
  P0 一致性修订：v0 的严重缺陷"超时后不对账直接重试"预设了渠道支持查询，而题面没有给出；
  已改为"既没有对账查询、也没有任何防重复保障就重新创建"。
  v0.2 修订：R8 不再要求"先查询渠道侧"，任一可靠的防重复方案均可；R5 降为普通项；C1、C2 降为普通项，
  C2 改为询问渠道侧可用的防重复能力，而不预设查询接口存在。

hard_constraints:
  - id: H1
    text: 渠道 A 限流 50 次/秒，渠道 B 限流 10 次/秒
    quote: 渠道 A 限流 50 次/秒，渠道 B 限流 10 次/秒
  - id: H2
    text: 任一渠道的失败不得影响其他渠道的同步
    quote: 任一渠道的失败不得影响其他渠道的同步
  - id: H3
    text: 同一商品在同一渠道不得被重复创建，重试必须幂等
    quote: 同一商品在同一渠道不得被重复创建，重试必须幂等
  - id: H4
    text: 商家可以在任务进行中取消，已经上架成功的商品不自动下架
    quote: 商家可以在任务进行中取消，已经上架成功的商品不自动下架
  - id: H5
    text: 任务结果保留 30 天
    quote: 任务结果保留 30 天
  - id: H6
    text: CSV 文件最多 10000 行
    quote: 最多 10000 行

required_items:
  - id: R1
    text: CSV 校验：行数上限 10000、必填字段与格式校验、行级错误报告；超过 10000 行时的处理
    source: ED
    core: false
    rationale: 题面给出上限和"校验后同步"；超限和行级错误的处理不定义则无法实现
    check: 行级错误报告 + 超限处理都有为 covered
  - id: R2
    text: 按渠道区分每个商品的同步结果，并定义任务层面如何呈现部分成功
    source: D
    core: true
    impact: 商家无法知道哪个渠道的哪些商品失败，手动重试和失败明细导出都没有依据
    rationale: 三个渠道独立且可部分失败，单一任务状态无法表达结果
    check: 每个商品在每个渠道都有可区分的结果，且任务层面能呈现部分成功；层级划分方式和状态命名不限
  - id: R3
    text: 渠道隔离：任一渠道失败或维护不影响其他渠道
    source: E
    core: true
    impact: 一个渠道故障拖垮全部渠道的同步，违反 H2
    check: 写明隔离机制或语义
  - id: R4
    text: 按渠道限流（A 50 次/秒，B 10 次/秒）
    source: E
    core: false
    check: 数值正确；自营商城未给限流，可标为假设
  - id: R5
    text: 自动重试策略：区分可重试与不可重试错误
    source: D
    core: false
    rationale: 题面列出的失败类型（单条失败、超时、维护）处理方式不同；无差别重试会放大限流压力。v0.2 降为普通项：重试次数和退避方式属于设计细节，防重复创建这一实质风险已由 R7、R8 覆盖
    check: 区分可重试与不可重试错误为 covered；重试次数与退避方式不限；只写"失败自动重试 N 次"为 partial
  - id: R6
    text: 商家手动重试失败商品（单个与批量）
    source: E
    core: false
    check: 有手动重试入口与范围
  - id: R7
    text: 幂等设计：防重复创建的键或机制，自动与手动重试都适用
    source: E
    core: true
    impact: 自动重试和手动重试都可能重复创建同一商品，违反 H3
    check: 说明以什么识别"同一商品"及如何防重复
  - id: R8
    text: 执行结果未知（如请求超时）时的处理：重新发起创建前，采用可靠的防重复手段
    source: D
    core: true
    impact: 超时后盲目重试会在渠道侧重复创建商品，违反 H3，且商家难以发现
    rationale: 超时不等于失败；把结果未知当失败直接重试是重复创建的主要来源，与题面的幂等约束直接相关
    check: |-
      识别出超时属于"结果未知"，并采用至少一种可靠手段，以下任一即可：
      重试前查询渠道侧是否已创建；使用渠道侧的请求幂等键或外部编码唯一约束；
      暂停自动重试并转人工或对账确认；其他能保证不重复创建的机制。
      依赖题面未保证的渠道能力（如查询接口、幂等键）时，须标注为假设，并给出该能力不存在时的备选，否则为 partial。
  - id: R9
    text: 取消语义：已发出的请求如何处理、未开始的商品不再同步、已成功的保持上架、取消后的最终状态
    source: ED
    core: true
    impact: 取消后仍有请求在途，最终哪些商品已上架不确定；若实现为回滚会违反 H4
    rationale: 题面给出"可取消且不自动下架"；进行中请求和最终状态不定义则取消结果不确定
    check: 四点中至少三点为 covered；未写"已成功不下架"为 missing
  - id: R10
    text: 渠道临时维护的处理（暂停该渠道、稍后恢复或判定失败）
    source: E
    core: false
    check: 有明确行为
  - id: R11
    text: 实时进度：按渠道展示成功、失败、进行中数量
    source: E
    core: false
    check: 进度维度包含渠道
  - id: R12
    text: 失败明细导出：字段包含商品标识、渠道、失败原因、是否可重试
    source: ED
    core: false
    rationale: 题面要求导出失败明细；字段决定商家能否据此处理
    check: 写明主要字段
  - id: R13
    text: 任务结果保留 30 天及到期后的行为
    source: E
    core: false
    check: 时限正确
  - id: R14
    text: 同一商家并发提交多个任务、或同一商品出现在多个进行中任务时的处理
    source: D
    core: false
    rationale: 与"同一商品不得重复创建"直接相关
    check: 给出规则或标为假设

clarifications:
  - id: C1
    question: 部分行校验失败时，其余通过校验的行是否继续同步
    core: false
    accept: 提出问题，或给出规则并标注为假设
  - id: C2
    question: 各渠道提供哪些可用于防重复的能力（按外部编码查询、请求幂等键、外部编码唯一约束等）
    core: false
    accept: 提出问题；或依赖某项能力时标注为假设，并给出该能力不存在时的备选
    not_counted: 直接假定渠道支持查询或幂等键而不标注
  - id: C3
    question: 商品在渠道中已存在时是更新、跳过还是报错
    core: false
    accept: 同上
  - id: C4
    question: 限流是按单个商家计算还是全平台共享
    core: false
    accept: 同上

acceptable_assumptions:
  - 校验失败的行跳过，其余行继续同步，失败行进入明细（标注为假设）
  - 以商家商品编码 + 渠道作为幂等键
  - 自营商城不设外部限流或使用内部限额（标注为假设）
  - 渠道维护期间该渠道任务暂停并定时探测恢复
  - 同一商品同时只允许存在于一个进行中的任务

critical_defects:
  - id: P05-X1
    condition: 执行结果未知（如请求超时）时，没有任何防重复手段（查询确认、渠道侧幂等、转人工或对账等均无）就直接重新创建
  - id: P05-X2
    condition: 取消任务时自动下架已成功上架的商品
  - id: P05-X3
    condition: 单个渠道失败或维护导致整个任务失败、或阻塞其他渠道
  - id: P05-X4
    condition: 完全没有幂等或防重复创建的设计
  - id: P05-X5
    condition: 限流数值与题面不符

judge_notes: |-
  R8 是本用例重点。只要识别出"超时 = 结果未知"并采用任一可靠的防重复手段即为 covered，
  不要求某一种特定技术方案，也不要求渠道一定提供查询接口。
  题面没有保证渠道具备查询或幂等能力：依赖这类能力而未标注假设、也没有备选的，R8 判 partial，不判 contradicted。
  不要求设计商品编辑、价格同步、库存同步等题面未提的功能。
  不要求设计商品编辑、价格同步、库存同步等题面未提的功能。
