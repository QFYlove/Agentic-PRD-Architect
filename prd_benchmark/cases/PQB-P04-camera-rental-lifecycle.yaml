id: PQB-P04
title: 摄影器材租赁订单生命周期
category: lifecycle # 多状态资源生命周期
case_version: v0.3 # v0.3: H quotes verbatim; H2 no extra qualifier; H6 grants only; R13 and C6 added
status: draft

frozen_input:
  user_idea: |-
    设计摄影器材租赁平台的订单生命周期。用户选择器材、租期和取货方式（到店自取或快递），下单时一次性支付租金和押金；门店确认库存后订单生效。到店自取的订单由用户在约定取货时间到店取货；快递订单由门店发货、用户签收。租赁期间用户可以申请续租，需库存允许并补付续租租金。租期结束时用户到店归还或寄回，门店验机：无损坏则退还押金、订单完成；有损坏则从押金中扣除维修费并出具扣费说明，维修费超出押金的部分由用户补缴。用户在取货或签收之前可以取消订单。
  target_audience: |-
    租赁用户、门店店员、平台客服。
  user_constraints: |-
    支付后 30 分钟内门店未确认的，订单自动取消并全额退还已付款项。距约定取货时间 24 小时以上取消的，全额退还租金；24 小时以内取消的，扣除 1 日租金。逾期归还按日租金的 1.5 倍计费，逾期超过 3 天由客服介入。押金退还需在验机完成后 2 个工作日内发起。用户对扣费有异议的，可在收到扣费说明后 7 天内申诉。

evaluator_context: |-
  考察完整状态机：状态集合、转换条件、终态、非法转换，以及每条计费和时限规则落在哪个状态上。
  题面有意保留了以下歧义，金标准不预设唯一答案，而要求 PRD 识别：
  1. 恰好 24 小时取消：中文惯例中"以上""以内"都包含本数，题面两条规则在恰好 24 小时时同时适用，互相冲突。
  2. 快递订单的"约定取货时间"指什么（发货时间、预计签收时间或其他），这决定 24 小时取消规则的基准点。
  P0 修订记录：v0 草稿把 R5 写成"按 24 小时分档"的确定规则，与题面边界歧义不一致；
  已改为由 C1 检查边界识别，R5 只检查两档规则本身。

# H2 restates the two tiers exactly as written. The exact-24-hour boundary (C1)
# and the time base for courier orders (C2) are ambiguities, not constraints:
# no single answer to either may be graded as an H2 violation.
hard_constraints:
  - id: H1
    text: 支付后 30 分钟内门店未确认的，订单自动取消并全额退还已付款项
    quote: 支付后 30 分钟内门店未确认的，订单自动取消并全额退还已付款项
  - id: H2
    text: 距约定取货时间 24 小时以上取消的，全额退还租金；24 小时以内取消的，扣除 1 日租金
    quote: 距约定取货时间 24 小时以上取消的，全额退还租金；24 小时以内取消的，扣除 1 日租金
    note: 恰好 24 小时的归属见 C1，快递订单的时间基准见 C2；对这两点的任何明确处理都不违反 H2。违反 H2 的情形是两档规则本身被改写（例如"48 小时以上全额退款"或"24 小时以内全额退款"）
  - id: H3
    text: 逾期归还按日租金的 1.5 倍计费，逾期超过 3 天由客服介入
    quote: 逾期归还按日租金的 1.5 倍计费，逾期超过 3 天由客服介入
  - id: H4
    text: 押金退还需在验机完成后 2 个工作日内发起
    quote: 押金退还需在验机完成后 2 个工作日内发起
  - id: H5
    text: 用户对扣费有异议的，可在收到扣费说明后 7 天内申诉
    quote: 用户对扣费有异议的，可在收到扣费说明后 7 天内申诉
  - id: H6
    text: 用户在取货或签收之前可以取消订单
    quote: 用户在取货或签收之前可以取消订单
    note: 只授予取货或签收前的取消能力。取货或签收之后是否允许取消、提前终止如何处理，题面没有规定（见 C6），任何明确的处理都不违反 H6。违反 H6 的情形是取货或签收前不允许用户取消
  - id: H7
    text: 有损坏则从押金中扣除维修费并出具扣费说明，维修费超出押金的部分由用户补缴
    quote: 有损坏则从押金中扣除维修费并出具扣费说明，维修费超出押金的部分由用户补缴
  - id: H8
    text: 续租需库存允许并补付续租租金
    quote: 需库存允许并补付续租租金

required_items:
  - id: R1
    text: 完整的状态集合，覆盖题面全部阶段（待确认、待取货或待发货、运输中、租赁中、逾期、归还中、待验机、待补缴、申诉中、已完成、已取消，名称可不同）
    source: ED
    core: true
    impact: 缺少的阶段没有对应状态，订单会卡在错误状态，计费和退款规则无处挂载
    rationale: 题面每个阶段都对应可观测的订单状态；快递往返和补缴、申诉是题面直接引出的状态
    check: 缺 1–2 个非关键状态为 partial；缺租赁中、待验机、已取消、已完成中的任何一个为 missing
  - id: R2
    text: 状态转换规则：每个转换的触发事件、执行者、前置条件
    source: D
    core: true
    impact: 不知道谁在什么条件下推动状态变化，状态机无法实现，非法转换无法拦截
    rationale: 只有状态列表无法实现状态机
    check: 主要转换均有触发与执行者；只有状态图没有条件为 partial
  - id: R3
    text: 终态定义，以及终态之后不可再转换
    source: D
    core: false
    rationale: 防止已完成或已取消订单被再次操作
    check: 明确列出终态
  - id: R4
    text: 支付后 30 分钟未确认 → 自动取消并全额退还（租金和押金）
    source: E
    core: true
    impact: 未确认订单长期占用用户资金，或退款范围错误（资金规则）
    check: 时限、触发方式（自动）、退款范围都要正确
  - id: R5
    text: 取货前取消的两档退款规则，以及取消时押金的退还
    source: ED
    core: true
    impact: 取消退款金额无法计算，直接产生资金纠纷
    rationale: 两档规则是题面给定的；取消时押金去向题面未写，但不写则退款不完整
    check: 两档规则与题面一致为 covered 的必要条件；未写押金去向为 partial（合理默认为全额退还）。恰好 24 小时的处理由 C1 单独检查，不在此扣分
  - id: R6
    text: 续租：库存校验、补付租金、库存不足或与后续订单冲突时的处理
    source: ED
    core: false
    rationale: 题面给出续租需库存允许；"不允许时怎么办"不定义则无法实现
    check: 三点齐全为 covered
  - id: R7
    text: 逾期按日租金 1.5 倍计费；逾期超过 3 天客服介入
    source: E
    core: true
    impact: 逾期费用无法计算，长期逾期的器材没有处置人
    check: 倍率、天数都正确；写明逾期从何时开始计算
  - id: R8
    text: 验机三个分支：无损退押金完成；有损从押金扣维修费并出具说明；超出押金部分补缴
    source: E
    core: true
    impact: 押金结算规则缺失，损坏场景下扣款和补缴无据可依
    check: 三个分支都要有，且补缴有对应状态或流程
  - id: R9
    text: 验机完成后 2 个工作日内发起押金退还
    source: E
    core: false
    check: 时限与起算点（验机完成）正确
  - id: R10
    text: 申诉：收到扣费说明后 7 天内可申诉，申诉期间扣费与押金的状态，申诉结果的处理
    source: ED
    core: false
    rationale: 时限是题面给定的；申诉期间资金状态不定义会与 2 个工作日退押金规则产生歧义
    check: 时限正确且写明申诉期间资金如何处理
  - id: R11
    text: 到店与快递两条路径的差异（发货、签收、寄回运输）
    source: ED
    core: false
    rationale: 题面给出两种取货方式，快递路径有额外的运输状态
    check: 两条路径都覆盖
  - id: R12
    text: 非法或受限的状态转换（例如验机前退押金、终态后再操作），以及取货或签收之后取消或提前终止的处理方式
    source: D
    core: false
    rationale: 状态机需要显式的非法转换。题面只规定了取货或签收前可以取消，之后能否取消是开放的设计选择（见 C6），可以禁止，也可以按提前归还等方式处理
    check: 至少列出与题面直接相关的非法转换，并对取货或签收后的取消请求给出处理（任一方式均可）或列为待确认
  - id: R13
    text: 下单时一次性支付租金和押金，门店确认库存后订单才生效
    source: E
    core: false
    check: 支付与订单生效的先后顺序与题面一致

clarifications:
  - id: C1
    question: 恰好在约定取货时间前 24 小时取消时，适用全额退还还是扣 1 日租金（题面两条规则在边界上冲突）
    core: true
    impact: 实现方会各自选择一侧，同一时刻取消的两笔订单退款金额可能不同，引发资金纠纷
    accept: 指出边界冲突并提出问题；或明确采用一侧（如"满 24 小时视为 24 小时以上"）并标注为假设、待确认
    not_counted: 只写"24 小时以上""24 小时以内"复述题面而不处理边界；悄悄采用一侧而未标注
  - id: C2
    question: 快递订单的"约定取货时间"以什么为准（预计发货、实际发货、预计签收），即 24 小时取消规则的基准点
    core: true
    impact: 快递订单的取消扣费没有确定的基准时间，规则无法执行
    accept: 提出问题，或明确定义基准点并标注为假设
  - id: C3
    question: 逾期费、超出押金的维修费是否可以直接从押金中扣除
    core: false
    accept: 提出问题，或给出规则并标注为假设
  - id: C4
    question: 申诉成功后的退款方式与时限
    core: false
    accept: 同上
  - id: C5
    question: 用户提前归还时是否退还未使用天数的租金
    core: false
    accept: 同上
  - id: C6
    question: 取货或签收之后用户能否取消或提前终止订单，如可以，费用如何计算
    core: false
    accept: 提出问题，或给出规则并标注为假设（禁止取消、按提前归还处理等均可）

acceptable_assumptions:
  - 满 24 小时视为"24 小时以上"，全额退还租金（标注为假设）
  - 快递订单以预计发货时间作为取货时间基准（标注为假设）
  - 取消时押金全额退还
  - 逾期"超过 3 天"指从第 4 天起
  - 申诉期间先退还未争议部分押金，争议部分冻结
  - 提前归还不退未使用天数的租金（标注为假设）
  - 下单支付失败时订单不生成或保持待支付，短时后关闭

critical_defects:
  - id: P04-X1
    condition: 存在没有出口的非终态（例如待补缴、申诉中没有后续状态）
  - id: P04-X2
    condition: 取货或签收之前不允许用户取消订单（剥夺题面明确给出的取消能力）
  - id: P04-X3
    condition: 验机完成前退还押金
  - id: P04-X4
    condition: 逾期倍率、取消扣费、30 分钟自动取消、2 个工作日或 7 天申诉中任一数值与题面不符
  - id: P04-X5
    condition: 恰好 24 小时的边界被当作题面已明确的规则写入，且该写法与题面任一条规则矛盾（例如写成"不足 24 小时全额退款"）

judge_notes: |-
  C1 是本用例的重点。三种处理都可接受：①指出冲突并列为待确认；②采用一侧并标注为假设；③给出明确规则并说明理由且列入待确认。
  只复述题面两条规则而不讨论边界，C1 判 missing，不判 contradicted。
  对恰好 24 小时或快递时间基准做出明确处理（无论选哪一侧）都不违反 H2；只有改写两档规则本身才违反 H2。
  取货或签收后的取消是开放问题（C6）：禁止取消、按提前归还处理、全额或部分退款，只要写明都不违反 H6。
  状态名称不要求与 R1 示例一致，按语义匹配。状态图（Mermaid 或文字）不加分，只看状态和转换是否完整。
