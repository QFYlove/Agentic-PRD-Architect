id: PQB-P06
title: 连锁健身房团课预约
category: conflicting_constraints # 相互冲突的约束
case_version: v0.3 # v0.3: H keeps only conflict-free base rules; conflicts K1-K4 listed explicitly
status: draft

frozen_input:
  user_idea: |-
    为连锁健身房设计团课预约小程序。会员可以预约未来 7 天内的团课，每节课名额固定。开课前 2 小时之前可以免费取消；开课前 2 小时内取消或未到场，计 1 次爽约；累计 3 次爽约的会员暂停预约资格 7 天。课程满员时可以排队候补，有人取消后由候补会员按排队顺序递补。
  target_audience: |-
    会员、门店前台、团课教练。
  user_constraints: |-
    以下要求分别来自不同部门，需要在 PRD 中统一处理：
    1. 老板：绝不允许超卖；同时要求会员在地下停车场等弱网甚至离线环境下点击预约时，界面立即显示"预约成功"。
    2. 运营：候补递补一直进行到开课前 15 分钟，递补后自动扣除课时，无需会员确认。教练：开课前 2 小时锁定上课名单，之后名单不再变化。
    3. 法务：不收集会员手机号。运营：递补成功后通过短信通知会员。
    4. 老板：以上全部功能两周内上线；目前团队只有 1 名前端和 1 名后端工程师。

evaluator_context: |-
  四组冲突是有意设计的，任何一组都不存在同时完全满足双方的方案。考察：逐一识别冲突、说明为什么冲突、
  给出取舍方案与推荐、标明需要谁拍板，并且不在正文中把未解决的冲突写成已满足。
  另有一个由题面推出的隐含冲突：自动递补且无需确认，被递补的会员可能并不知情，却要承担 2 小时内无法免费取消和爽约计数的后果。
  P0 一致性修订：v0 的冲突②（自动递补 vs 2 小时不得变更状态）在 2 小时停止取消的规则下实际不会触发；
  已改为"递补到开课前 15 分钟" vs "开课前 2 小时锁定名单"，并让 2 小时内取消计爽约，使名额在 2 小时内仍可能释放。
  另删除了 v0 题面中的"迟到"，因为题面和金标准都没有给出迟到的判定依据。
  v0.3 修订：H 只保留不参与任何冲突的基础规则。"名额固定"（冲突①的一侧）和"按排队顺序递补"（冲突②相关）
  移出 H，由冲突识别与决策评分（R1、R2、R5、R11）处理；"递补者首次豁免"只能作为标明待业务批准的备选方案。

# Only base rules that no conflict touches are hard constraints. The department
# requirements conflict by design, and "fixed capacity" and "waitlist promotion
# in queue order" are sides of conflicts ① and ②: openly trading one side away
# is the expected behaviour and is never a hard-constraint violation.
hard_constraints:
  - id: H1
    text: 会员可以预约未来 7 天内的团课
    quote: 会员可以预约未来 7 天内的团课
  - id: H2
    text: 开课前 2 小时之前可以免费取消；开课前 2 小时内取消或未到场，计 1 次爽约
    quote: 开课前 2 小时之前可以免费取消；开课前 2 小时内取消或未到场，计 1 次爽约
    note: 把"递补者首次豁免"等例外作为明确标记、待业务批准的备选方案提出，不违反 H2；把例外写成已确定的默认规则才违反 H2
  - id: H3
    text: 累计 3 次爽约的会员暂停预约资格 7 天
    quote: 累计 3 次爽约的会员暂停预约资格 7 天

# How the conflict sides are graded: never as H violations when the trade-off is
# documented (see judge_notes and rubric.md section 2.4).
conflicts:
  - id: K1
    sides: [每节课名额固定 / 绝不允许超卖, 离线环境下点击预约立即显示"预约成功"]
    items: [R1, R5, R6]
  - id: K2
    sides: [候补递补一直进行到开课前 15 分钟（并按排队顺序自动递补）, 开课前 2 小时锁定上课名单]
    items: [R2, R5, R11]
  - id: K3
    sides: [不收集会员手机号, 递补成功后通过短信通知会员]
    items: [R3, R5, R7]
  - id: K4
    sides: [以上全部功能两周内上线, 1 名前端和 1 名后端工程师]
    items: [R4, R8]

required_items:
  - id: R1
    text: 识别冲突①：不超卖 vs 离线立即显示预约成功，并说明原因（离线时无法确认剩余名额）
    source: E
    core: true
    impact: 未识别时，实现方会同时按两条要求开发，离线"成功"的预约在上线后造成超卖
    check: 明确指出两者不能同时满足；只是分别满足两条要求而不提冲突为 missing
  - id: R2
    text: 识别冲突②：递补到开课前 15 分钟 vs 开课前 2 小时锁定名单
    source: E
    core: true
    impact: 未识别时，教练拿到的名单在开课前仍会变化，或运营的递补规则被静默放弃
    check: 同上
  - id: R3
    text: 识别冲突③：不收集手机号 vs 短信通知
    source: E
    core: true
    impact: 未识别时，可能为发短信而收集手机号，违反法务要求
    check: 同上
  - id: R4
    text: 识别冲突④：两周、两人的资源与全部功能范围之间的矛盾
    source: E
    core: false
    check: 指出范围或工期风险
  - id: R5
    text: 冲突①②③各给出至少一个可行方案，并给出推荐及其代价
    source: D
    core: true
    impact: 只指出冲突而不给方案，决策方无法拍板，开发无法开始
    rationale: 只指出冲突而不给方案，决策方无法拍板
    check: 三组都有方案与推荐为 covered；只有部分有为 partial
  - id: R6
    text: 不超卖的一致性机制：离线只能提交"预约请求"或排队，成功与否以服务端确认为准，并告知会员结果
    source: D
    core: false
    rationale: 冲突①的任何可行方案都必须以服务端为准，否则必然超卖。v0.2 降为普通项：识别冲突（R1）和给出方案（R5）已覆盖其主要影响，此项检查的是机制细节
    check: 写明服务端确认为准，以及离线提交后的最终结果通知
  - id: R7
    text: 不使用手机号的通知替代方案（例如小程序订阅消息、站内消息）及其局限（需会员授权、可能收不到）
    source: D
    core: false
    rationale: 冲突③的常见解法，但需说明其不确定性
    check: 有替代方案即可；说明局限为加分项但不单独计分
  - id: R8
    text: MVP 范围切分：两周内上线哪些、哪些延后
    source: D
    core: false
    rationale: 冲突④的可执行解法
    check: 有明确的首期与延后清单
  - id: R9
    text: 爽约规则：2 小时内取消或未到场计 1 次；累计 3 次暂停 7 天；暂停期间的行为（已有预约和候补如何处理）
    source: ED
    core: false
    rationale: 计数和处罚是题面给定的；暂停期间已有预约的处理题面未给
    check: 规则数值正确，且写明暂停期间的处理
  - id: R10
    text: 自动递补与爽约规则之间的公平性问题，以及缓解方式（例如递补截止时间、确认窗口；或标明待业务批准的"递补者首次豁免"）
    source: D
    core: false
    rationale: 题面"无需确认的自动递补"与"2 小时内取消计爽约"叠加，被递补会员可能在不知情的情况下被处罚
    check: 识别该问题并给出处理或列为待确认。"递补者首次豁免"只能作为明确标记、待业务批准的备选方案；若写成已确定的默认规则，按改写 H2 处理
  - id: R11
    text: 预约窗口 7 天、名额与候补规则（满员排队候补、有人取消后按排队顺序递补、递补后扣课时），以及在冲突②取舍下递补何时停止
    source: E
    core: false
    check: 规则都有描述；为解决冲突②而改变递补截止时间（例如截止到开课前 2 小时）并写明取舍与被放弃的要求时为 covered，不判 contradicted
  - id: R12
    text: 未到场的判定方式（签到方式与签到截止时间）
    source: D
    core: false
    rationale: 题面把未到场计为爽约，但没有判定依据就无法计数
    check: 给出判定方式或列为待确认

clarifications:
  - id: C1
    question: 各组冲突由谁拍板、优先级如何（例如不超卖是否优先于离线体验）
    core: false
    accept: 对每组冲突指出需要的决策人或决策问题；统一列出"需老板/法务/运营/教练确认"的决策清单亦可
  - id: C2
    question: 爽约的累计周期（滚动 30 天、自然月或永久累计）
    core: false
    accept: 提出问题，或给出周期并标注为假设
  - id: C3
    question: 会员是否已授权小程序消息通知，现有会员体系能否提供其他联系方式
    core: false
    accept: 提出通知渠道可用性的问题

acceptable_assumptions:
  - 推荐不超卖优先，离线时显示"已提交，等待确认"（作为方案并列入待确认）
  - 推荐递补截止在开课前 2 小时，与教练锁定名单一致（作为方案并列入待确认）
  - 用小程序订阅消息替代短信（作为方案并列入待确认）
  - 首期上线预约、取消、候补和爽约计数，消息通知和复杂报表延后
  - 爽约按滚动 30 天累计（标注为假设）
  - 递补者首次豁免爽约（仅限明确标注为待业务批准的备选方案）

critical_defects:
  - id: P06-X1
    condition: 声称或设计为离线时立即确认预约成功，同时声称保证不超卖，且未说明冲突
  - id: P06-X2
    condition: 同时写入"递补持续到开课前 15 分钟"和"开课前 2 小时锁定名单"而不处理二者矛盾
  - id: P06-X3
    condition: 设计为收集手机号并发送短信，且未指出与法务要求的冲突
  - id: P06-X4
    condition: 某个部门的要求在文档中被完全忽略（既未采纳也未作为冲突讨论）

judge_notes: |-
  不要求文档"解决"冲突，要求的是识别、给方案、给推荐、标决策人。推荐哪一侧都可以，只要写明代价。
  只要文档明确识别冲突、解释取舍、标明被放弃的要求并提出决策建议，就不能因为没有同时实现冲突双方而判 contradicted、
  引用 H 条目或提出严重缺陷候选（conflicts 中的 K1–K4 两侧都不是 H 条目）。
  严重缺陷只针对"未说明冲突就声称双方都满足"或"完全忽略某方"的情形（P06-X1–X4）。
  "递补者首次豁免"等对爽约规则的例外：作为标明待批准的备选方案提出是好的做法；写成已确定的默认规则，按违反 H2 处理。
  把冲突放在单独的"约束冲突与决策"章节或分散在各功能处都可以，按内容判定。
  R10 和 R12 是由题面推导的隐含问题，权重为 1，未识别不构成严重缺陷。
