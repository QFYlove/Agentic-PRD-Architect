id: PQB-P03
title: 企业内部采购审批
category: multi_role # 多角色协作流程
case_version: v0.3 # v0.3: H quotes verbatim; H6 no longer implies a mandatory-field check; R5 checks inquiry order
status: draft

frozen_input:
  user_idea: |-
    为一家约 300 人的公司设计内部采购申请系统。员工提交采购申请，填写物品、数量、预估金额、用途和期望到货日期。审批流程：所有申请先由申请人的直属主管审批；预估金额大于或等于 2 万元的，主管通过后还需财务审批；预估金额大于或等于 10 万元的，财务通过后还需总经理审批。全部审批通过后，由采购专员询价，至少取得 3 家供应商报价，预估金额低于 5000 元的申请可免询价；之后采购专员下单并登记到货。申请人确认收货后流程结束。任一审批人都可以驳回申请并填写原因，申请人修改后可以重新提交。
  target_audience: |-
    申请人（普通员工）、直属主管、财务、总经理、采购专员。
  user_constraints: |-
    审批人 48 小时未处理时提醒该审批人；72 小时仍未处理时上报给该审批人的上级，不得自动通过。审批人可以设置代理人代为审批。申请人不能审批自己的申请。所有审批操作需要留痕。

evaluator_context: |-
  规则较明确的多角色流程。主要考察角色职责、金额路由边界、驳回与重提、超时升级、代理与自审防护。
  题面有几处有意留下的空白：总经理没有上级时 72 小时上报给谁、总经理本人提交时谁审批、
  驳回后重提从哪一级重新开始、询价后实际金额超出预估怎么办。

hard_constraints:
  - id: H1
    text: 所有申请先经直属主管；预估金额 ≥2 万元，主管通过后还需财务审批；≥10 万元，财务通过后还需总经理审批
    quote: 所有申请先由申请人的直属主管审批；预估金额大于或等于 2 万元的，主管通过后还需财务审批；预估金额大于或等于 10 万元的，财务通过后还需总经理审批
  - id: H2
    text: 询价至少取得 3 家供应商报价；预估金额 <5000 元可免询价
    quote: 至少取得 3 家供应商报价，预估金额低于 5000 元的申请可免询价
  - id: H3
    text: 48 小时未处理提醒审批人；72 小时仍未处理上报其上级；不得自动通过
    quote: 审批人 48 小时未处理时提醒该审批人；72 小时仍未处理时上报给该审批人的上级，不得自动通过
  - id: H4
    text: 申请人不能审批自己的申请
    quote: 申请人不能审批自己的申请
  - id: H5
    text: 所有审批操作需要留痕
    quote: 所有审批操作需要留痕
  - id: H6
    text: 任一审批人可以驳回申请并填写原因；申请人修改后可以重新提交
    quote: 任一审批人都可以驳回申请并填写原因，申请人修改后可以重新提交
    note: 题面没有规定"原因必填"的校验；把原因设为必填或选填都不违反 H6。违反 H6 的情形是不允许驳回、驳回时无法填写原因，或被驳回后不能修改重提

required_items:
  - id: R1
    text: 五类角色的职责与可执行操作
    source: E
    core: false
    check: 每个角色都有职责说明
  - id: R2
    text: 申请字段：物品、数量、预估金额、用途、期望到货日期
    source: E
    core: false
    check: 五个字段齐全；缺一项为 partial
  - id: R3
    text: 按预估金额路由：所有申请经直属主管；≥2 万追加财务；≥10 万再追加总经理；顺序为主管→财务→总经理
    source: E
    core: true
    impact: 审批路由是本系统的核心控制；缺失或边界不清会让大额申请绕过财务或总经理
    check: 阈值、比较符（≥）和顺序都正确；把 ≥ 写成 > 判为 contradicted
  - id: R4
    text: 驳回时可填写原因；申请人修改后重新提交
    source: E
    core: true
    impact: 被驳回的申请没有后续路径，只能作废重建，审批历史断裂
    check: 驳回能附带原因 + 修改重提两点都要有；原因是否必填由文档自行决定，不影响判定
  - id: R5
    text: 询价规则：全部审批通过后询价；至少 3 家报价；预估金额 <5000 元免询价
    source: E
    core: true
    impact: 采购比价控制缺失，可能单一来源下单，题面明确的内控要求落空
    check: 两条询价规则都要有，且基于预估金额；询价排在全部审批通过之后（排在审批前或与审批并行为 partial）
  - id: R6
    text: 采购专员下单与登记到货
    source: E
    core: false
    check: 两个动作都要有
  - id: R7
    text: 申请人确认收货后流程结束
    source: E
    core: false
    check: 结束条件明确
  - id: R8
    text: 48 小时提醒审批人；72 小时上报其上级；任何情况下不自动通过
    source: E
    core: true
    impact: 审批会无限期卡住，或被实现为超时自动通过（违反 H3）
    check: 三点都要有；写成超时自动通过判为 contradicted
  - id: R9
    text: 审批代理人：设置方式与代理审批的效力
    source: E
    core: false
    check: 写明如何设置及代理审批如何记录
  - id: R10
    text: 自审禁止，包括代理人恰好是申请人本人的情况
    source: ED
    core: true
    impact: 申请人可通过代理关系审批自己的申请，审批控制被绕过
    rationale: 题面禁止自审；代理机制使"代理人即申请人"成为必然出现的绕过路径
    check: 写明自审禁止；覆盖代理场景为 covered，只写一般规则为 partial
  - id: R11
    text: 审批留痕：记录操作人、时间、动作、意见，含代理审批
    source: E
    core: false
    check: 留痕内容具体
  - id: R12
    text: 部分到货的处理
    source: D
    core: false
    rationale: 下单后分批到货是采购常态，不定义会导致"确认收货"语义不清
    check: 给出规则或标为假设

clarifications:
  - id: C1
    question: 驳回后重新提交，是从直属主管重新开始审批，还是从驳回的那一级继续
    core: true
    impact: 修改后的申请可能只经过驳回那一级，前面已通过的审批人看不到修改内容，审批对象与实际内容不一致
    accept: 提出问题，或给出规则并标注为假设
  - id: C2
    question: 询价后实际金额超出预估金额（尤其是跨过 2 万或 10 万阈值）时，是否需要重新审批
    core: true
    impact: 可通过低报预估金额绕过财务或总经理审批
    accept: 同上
  - id: C3
    question: 总经理审批 72 小时未处理时上报给谁（总经理没有上级）
    core: false
    accept: 同上
  - id: C4
    question: 申请人本人是直属主管链上的审批人（例如总经理或财务人员提交申请）时由谁审批
    core: false
    accept: 同上；与 R10 不重复计分：R10 看是否禁止自审，C4 看替代审批人如何确定

acceptable_assumptions:
  - 驳回后从第一级重新审批（标注为假设）
  - 实际金额超出预估一定比例或跨越阈值时重新走对应审批（标注为假设）
  - 总经理超时上报给指定的管理员或董事会代表（标注为假设）
  - 代理期间原审批人仍可审批
  - 提醒通过站内信和邮件发送

critical_defects:
  - id: P03-X1
    condition: 任何超时规则导致申请自动通过
  - id: P03-X2
    condition: 设计上允许申请人审批自己的申请（含通过代理）
  - id: P03-X3
    condition: 金额 ≥2 万的申请可以不经财务，或 ≥10 万的申请可以不经总经理
  - id: P03-X4
    condition: 免询价阈值或报价数量与题面不符

judge_notes: |-
  阈值比较符以题面"大于或等于"为准：恰好 2 万元需要财务审批，恰好 10 万元需要总经理审批，恰好 5000 元需要询价。
  并行审批（主管与财务同时审批）与题面"主管通过后"的顺序不符，判为 R3 contradicted。
  不要求预算管理、供应商准入、合同管理等题面未提的模块。
